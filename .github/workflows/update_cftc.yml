name: Update CFTC Data

on:
  schedule:
    - cron: '30 21 * * 5'   # Friday 21:30 UTC  — primary (CFTC releases ~21:00 UTC)
    - cron: '30 03 * * 6'   # Saturday 03:30 UTC — retry if Friday release was late
    - cron: '30 21 * * 1'   # Monday 21:30 UTC   — catch holiday/slip delays (Friday holiday delays update Socrata Monday ~19:30 UTC)
    - cron: '30 21 * * 2'   # Tuesday 21:30 UTC  — catch holiday/slip delays (Monday holiday delays update Socrata Tuesday ~19:30 UTC)
  workflow_dispatch:          # Allow manual trigger from Actions tab
    inputs:
      force:
        description: 'Rebuild even if CFTC has no new report'
        type: boolean
        default: false

concurrency:
  group: data-pipeline-push   # shared with update_cta_model.yml so pushes never race
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy



      - name: Run CFTC pipeline
        id: pipeline
        run: python scripts/update_cftc_data.py ${{ inputs.force && '--force' || '' }}

      - name: Verify output exists and is non-empty
        if: steps.pipeline.outputs.new_data == 'true'
        run: |
          test -f data/cftc_processed.json
          test $(wc -c < data/cftc_processed.json) -gt 100000

      # Re-fit the CTA model's $ scale to the new COT report. A Yahoo outage must
      # not block the CFTC commit, and the daily CTA workflow will retry anyway.
      - name: Refresh CTA model
        if: steps.pipeline.outputs.new_data == 'true'
        continue-on-error: true
        run: python scripts/update_cta_model.py

      - name: Refresh cycle analysis
        if: steps.pipeline.outputs.new_data == 'true'
        continue-on-error: true
        run: python scripts/update_cycle_analysis.py

      # Quality gate on EVERY output (COT data, CTA model, cycle analysis) before
      # anything is committed; runs after the models so it checks fresh files.
      - name: Run Quantitative Parity Audit
        if: steps.pipeline.outputs.new_data == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/run_quantitative_parity_audit.py

      - name: Commit and push
        if: steps.pipeline.outputs.new_data == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cftc_processed.json
          if [ -f data/cta_model.json ]; then git add data/cta_model.json; fi
          if [ -f data/cycle_analysis.json ]; then git add data/cycle_analysis.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: update CFTC data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
